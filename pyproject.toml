[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandsense"
version = "0.1.0"
description = "Leakage-safe demand forecasting and inventory decision support."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "DemandSense Project" }]
dependencies = [
  "numpy>=2.1,<3",
  "polars>=1.32,<2",
  "pyarrow>=20,<24",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
]

[project.optional-dependencies]
app = [
  "fastapi>=0.115,<1",
  "plotly>=6,<7",
  "requests>=2.32,<3",
  "streamlit>=1.45,<2",
  "uvicorn[standard]>=0.34,<1",
]
data = [
  "kaggle>=2.2,<3",
]
foundation = [
  "chronos-forecasting>=2,<3",
]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
demandsense = "demandsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["demandsense"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
