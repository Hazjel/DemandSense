paths:
  raw_dir: data/raw/m5
  interim_dir: data/interim/m5
  processed_dir: data/processed/m5
  artifact_dir: artifacts

data:
  source: m5
  competition: m5-forecasting-accuracy
  store_id: CA_1
  profile: development
  series_limit: 300
  selection_seed: 42

forecast:
  horizon: 28
  minimum_history_days: 112
  development_folds: 3

segmentation:
  fast_max_zero_ratio: 0.20
  intermittent_min_zero_ratio: 0.60

validation:
  global_missing_price_warning_ratio: 0.25
  series_missing_price_warning_ratio: 0.75
  long_zero_run_warning_days: 84
  inactive_tail_warning_days: 84
  extreme_quantity_quantile: 0.999
  extreme_price_change_ratio: 1.00

models:
  global_model: xgboost
  xgboost_device: cuda
  foundation_model: amazon/chronos-bolt-small
  foundation_batch_size: 8

runtime:
  random_seed: 42
  n_jobs: 8
